[project]
name = "eu-regulatory-intelligence"
version = "0.1.0"
authors = [{ name = "Maksym Zyultsle" }]
description = "Evidence-grounded research on EU regulation with verifiable citations and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
    "llama-index-core>=0.14.25",
    "llama-index-vector-stores-qdrant>=0.10.4",
    "qdrant-client>=1.20.0",
    "fastembed>=0.9.1",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "openai>=3.40.0",
]

[dependency-groups]
dev = ["ruff>=0.17.3", "pre-commit>=4.7.0"]

[tool.ruff]
target-version = "py314"
line-length = 99
preview = false

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.uv]
required-version = ">=0.13.6"
